name: .NET build pipeline

# Triggers
on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

#: Jobs to execute
jobs:
  ## Build DockerFileCopy image
  build-and-deploy-documentation:
    runs-on: ubuntu-latest

    steps:
    ### Checkout repo
    - uses: actions/checkout@v3
      with: 
        fetch-depth: 0

    ### Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: site/package-lock.json

    ### Install dependencies
    - name: Install site dependencies
      working-directory: site
      run: npm ci

    ### Build site
    - name: Build website
      working-directory: site
      run: npm run build

    ### Prevent Jekyll from removing _astro assets
    - name: Add .nojekyll
      run: touch site/dist/.nojekyll

    
    ### Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: kingtechnl/githubactions/deploy-pages@main
      with:
        sourceDir: '${{ github.workspace }}/site/dist'
        targetBranch: 'gh-pages'
        commitMessage: "Deploy site github actions"
        userName: 'github-actions'
        userEmail: 'github-actions@users.noreply.github.com'
        token: ${{ secrets.DEPLOYMENT_TOKEN }}
        #url: 'www.kingtech.nl'
    
        